<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bankroll">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Bankroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0B0E13;--bar:#0D1016;--card:#12161D;--card2:#0F1319;--raised:#1A1F28;--raised2:#232A35;
  --line:#1E242E;--line2:#262D38;--line3:#2E3644;--grid:#1F252F;--axis:#343C49;
  --ink:#EEF1F6;--ink2:#A9B2C1;--ink3:#C3CAD6;--muted:#7F8899;--dim:#4F5868;
  --gain:#1FA874;--loss:#E8692C;--gainT:#4FD49B;--lossT:#FF9A66;--neutral:#6B7585;
  --accent:#A48BFF;--accentT:#C9BCFF;--onAccent:#0B0E13;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
a{color:var(--accentT)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.disp{font-family:"Space Grotesk",Inter,sans-serif}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}.ink3{color:var(--ink3)}
.s{font-size:13px}.xs{font-size:12px}.b{font-weight:600}
.min0{min-width:0;flex:1 1 0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}

/* Barra superior */
.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);opacity:0;pointer-events:none}
body.busy .top::after{opacity:1;animation:loadbar 1.1s ease-in-out infinite}
@keyframes loadbar{0%{left:0;width:0}50%{left:15%;width:70%}100%{left:100%;width:0}}
.top-in{max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--onAccent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{padding:10px 16px;border-radius:999px;border:0;background:none;color:var(--ink2);font-weight:500}
.tab[aria-current="page"]{background:var(--raised);color:var(--ink);font-weight:600}
.spacer{flex:1 1 0}
.btn-acc{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:var(--onAccent);font-weight:600}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink);font-weight:500}
.btn-danger{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--loss);color:var(--onAccent);font-weight:600}
.wide{width:100%}
.link{background:none;border:0;padding:10px 0;color:var(--accentT);font-weight:600}
.link.danger{color:var(--lossT)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}

/* Estructura */
main{max-width:1280px;margin:0 auto;padding:32px 32px 72px}
.page{display:flex;flex-direction:column;gap:20px}
.narrow{max-width:640px;margin:0 auto;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{margin:6px 0 4px;font-family:"Space Grotesk",Inter,sans-serif;font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.h2{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:19px;font-weight:600}
.h3{margin:0;font-size:14px;font-weight:600}
.sub{margin:4px 0 0;color:var(--ink2);font-size:13px}
.monthnav{display:flex;align-items:center;gap:10px}
.monthnav .h1{margin:6px 4px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.grow{flex:999 1 600px;min-width:0}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px}
.empty{padding:20px;border-radius:14px;border:1px dashed var(--line3);color:var(--ink2);text-align:center}
.loading{padding:80px 20px;text-align:center;color:var(--ink2)}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:10px;padding:22px 24px}
.kpi .lbl{color:var(--ink2);font-weight:500}
.kpi .val{font-family:"Space Grotesk",Inter,sans-serif;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .note{color:var(--muted);font-size:13px}
.strip{display:flex;gap:3px;min-height:12px}
.strip i{flex:1 1 0;max-width:22px;height:12px;border-radius:3px}
.seg{display:flex;gap:2px;padding:3px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1 1 0;min-width:52px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink2);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raised2);color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Gráfico */
.chart{position:relative;height:240px;margin:30px 8px 0 64px}
.chart .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.chart .gl.base{border-top:1px dashed #5A6474}
.chart .yl{position:absolute;left:-64px;width:54px;text-align:right;font-size:12px;color:var(--muted);transform:translateY(-50%)}
.chart svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.chart .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--card)}
.chart .tip{position:absolute;padding:5px 10px;border-radius:8px;background:var(--raised);border:1px solid #2A313D;font-size:13px;font-weight:600;white-space:nowrap;transform:translate(-50%,-44px)}
.chart .tip.r{transform:translate(-100%,-44px)}
.chart .tip.l{transform:translate(0,-44px)}
.chart .msg{position:absolute;left:0;right:0;top:28%;text-align:center;color:var(--muted);font-size:13px}
.xt{position:relative;height:18px;margin:10px 8px 0 64px;color:var(--muted);font-size:12px}
.xt span{position:absolute;white-space:nowrap}

/* Calendario */
.cal-wrap{overflow-x:auto;margin-top:18px}
.cal{min-width:520px}
.wk,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk{margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:600;text-align:center}
.cell{height:88px;border-radius:14px;padding:8px 10px}
.cell.dim{border:1px solid #161B22;color:var(--dim);font-weight:600}
.cell.day{border:2px solid rgba(255,255,255,.04);background:#151A22;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left}
.cell.day.pos{background:rgba(31,168,116,.14)}
.cell.day.neg{background:rgba(232,105,44,.14)}
.cell.day[aria-pressed="true"]{border-color:var(--accent)}
.cell .tr{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600}
.cell .tag{font-size:11px;color:var(--accentT)}
.cell .pn{display:flex;flex-direction:column}
.cell .p{font-family:"Space Grotesk",Inter,sans-serif;font-size:16px;font-weight:600}
.cell .n{font-size:11px;color:var(--ink2)}

/* Detalle */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .lbl{font-size:12px;color:var(--ink2)}
.tile .v{margin-top:4px;font-family:"Space Grotesk",Inter,sans-serif;font-size:24px;font-weight:600;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--raised)}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}

/* Movimientos */
.mvs{display:flex;flex-direction:column;gap:8px}
.mv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.mv-ic{width:36px;height:36px;flex:none;border-radius:10px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--accent)}

/* Mercados */
.mrow{display:grid;grid-template-columns:160px minmax(0,1fr) 92px;align-items:center;gap:14px;min-height:52px;border-bottom:1px solid var(--raised)}
.mtrack{position:relative;height:10px}
.mtrack .z{position:absolute;top:-10px;bottom:-10px;width:1px;background:var(--axis)}
.mtrack .bf{position:absolute;top:0;height:10px}
.mode{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* Apuestas */
.bets{display:flex;flex-direction:column;gap:12px}
.bets.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.bet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.b-ev{font-weight:600}
.b-sel{margin-top:2px;font-size:13px;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag-p{padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--ink3);font-size:12px}
.bet-bot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px solid var(--raised)}
.net{font-size:17px;font-weight:600}
.st{flex:none;display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border-radius:999px;font-size:12px;font-weight:600}
.st.w{background:rgba(31,168,116,.16);color:var(--gainT)}
.st.l{background:rgba(232,105,44,.16);color:var(--lossT)}
.st.c{background:#1F2530;color:var(--ink3)}
.st.p{background:rgba(164,139,255,.16);color:var(--accentT)}
.st.a{background:#1F2530;color:var(--muted)}
.settle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sbtn{height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-size:13px;font-weight:600}
.sbtn.win{border-color:rgba(31,168,116,.55);color:var(--gainT)}
.sbtn.lose{border-color:rgba(232,105,44,.55);color:var(--lossT)}
.bet-act{display:flex;justify-content:flex-end;gap:18px;margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink3);font-size:13px;font-weight:500}
.chip.pill{border-radius:999px;padding:0 16px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--raised);color:var(--ink);font-weight:600}
.chip.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.chip .c{margin-left:6px;color:var(--muted)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}

/* Hoy */
.hero{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:22px}
.hero .big{font-family:"Space Grotesk",Inter,sans-serif;font-size:44px;line-height:1;font-weight:600;letter-spacing:-.02em}
.hero .tile{border:0;border-radius:16px;padding:12px 14px}
.hero .tile .v{margin-top:0;font-size:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:4px}
.sec-h h2{margin:0;font-size:15px;font-weight:600}
.ldays{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.ld{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding:11px 0;border-bottom:1px solid var(--raised)}
.ld:last-child{border-bottom:0}
.ld span:not(:first-child){text-align:right;font-weight:600}
.ld.h{font-size:12px;color:var(--muted)}
.ld.h span{font-weight:500}

/* Formulario */
.form-head{display:flex;align-items:center;gap:12px}
.bank-mini{margin-left:auto;text-align:right}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.form-col{display:flex;flex-direction:column;gap:20px}
.form-side{position:sticky;top:92px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:10px}
.flabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line2);border-radius:14px;background:var(--card);color:var(--ink);font-size:15px;outline:none}
.input:focus{border-color:var(--accent)}
.input.big{height:52px;font-family:"Space Grotesk",Inter,sans-serif;font-size:18px;font-weight:600}
.input::placeholder{color:var(--muted)}
input[type=date].input{color-scheme:dark}
.selrow{display:flex;gap:10px}
.selrow .seg{flex:1 1 0}
.selrow .seg button{height:44px}
.stepper{display:flex;align-items:center;gap:4px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.stepper button{width:44px;height:44px;border:0;border-radius:9px;background:var(--raised);color:var(--ink);display:flex;align-items:center;justify-content:center}
.stepper .sv{min-width:52px;text-align:center;font-family:"Space Grotesk",Inter,sans-serif;font-size:18px;font-weight:600}
.preview{display:flex;flex-direction:column;gap:12px;padding:18px}
.save-bar{display:none}

/* Navegación del celular */
.bottom{display:none}
.fab{display:none}

/* Diálogo y avisos */
#modal{position:fixed;inset:0;background:rgba(5,7,10,.68);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal[hidden]{display:none}
.sheet{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:20px}
.sheet p{margin:0}
.m-actions{display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 16px;border-radius:12px;background:var(--raised);border:1px solid var(--line2);font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:60}
#toast[hidden]{display:none}
#toast.err{border-color:rgba(232,105,44,.7)}
body.busy{cursor:progress}
body.busy [data-act="save"],body.busy [data-act="save-mov"],body.busy [data-act="connect"],body.busy .sbtn{opacity:.55;pointer-events:none}
.connect{max-width:460px;margin:4vh auto 0}
.connect .mark{width:52px;height:52px;border-radius:16px}
.err-box{padding:12px 14px;border-radius:12px;border:1px solid rgba(232,105,44,.55);background:rgba(232,105,44,.08);color:var(--lossT);font-size:13px}
.help{font-size:12px;color:var(--muted);line-height:1.5}
.top .icon-btn{width:40px;height:40px;border-radius:12px;color:var(--ink2)}
body.connecting .bottom,body.connecting .fab,body.connecting .tabs,body.connecting #btn-nueva,body.connecting #btn-refresh{display:none!important}

@media (max-width:759px){
  .top-in{padding:12px 20px}
  .top .tabs,.top .btn-acc{display:none}
  main{padding:18px 20px 120px}
  .h1{font-size:28px}
  .head{align-items:flex-start}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px 16px;gap:6px}
  .kpi .val{font-size:22px}
  .kpi .note{font-size:12px}
  .card{padding:18px;border-radius:16px}
  .chart{height:200px;margin-left:52px}
  .chart .yl{left:-52px;width:44px;font-size:11px}
  .xt{margin-left:52px}
  .cal{min-width:0}
  .wk,.cal-grid{gap:5px}
  .cell{height:54px;padding:5px 2px;border-radius:12px}
  .cell.day{align-items:center}
  .cell .tr{justify-content:center}
  .cell .tag,.cell .n,.cell .pc{display:none}
  .cell .pn{align-items:center}
  .cell .p{font-size:11px}
  .cell.dim{text-align:center;padding-top:7px;font-size:13px}
  .mrow{grid-template-columns:104px minmax(0,1fr) 78px;gap:10px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .form-side{position:static}
  .save-desk,.hide-m{display:none}
  .save-bar{display:block;position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--line);z-index:30}
  .save-bar .btn-acc{width:100%;height:54px;font-size:16px}
  .bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:var(--bar);border-top:1px solid var(--line);z-index:30}
  .bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);font-size:11px;font-weight:500}
  .bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
  .fab{display:flex;position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:20px;background:var(--accent);color:var(--onAccent);align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(0,0,0,.5);z-index:31}
  .fab[hidden]{display:none}
  body.formview .bottom{display:none}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark" id="brand-mark"></span><span class="disp">Bankroll</span></div>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-nav data-act="view" data-v="hoy">Hoy</button>
      <button class="tab" data-nav data-act="view" data-v="mes">Mes</button>
      <button class="tab" data-nav data-act="view" data-v="apuestas">Apuestas</button>
      <button class="tab" data-nav data-act="view" data-v="mov">Bank</button>
    </nav>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-refresh" data-act="refresh" aria-label="Actualizar datos"></button>
    <button class="btn-acc" data-act="view" data-v="nueva" id="btn-nueva">Nueva apuesta</button>
  </div>
</header>

<main id="app"><div class="loading">Cargando tu registro…</div></main>

<button class="fab" id="fab" data-act="view" data-v="nueva" aria-label="Registrar nueva apuesta"></button>
<nav class="bottom" id="bottom" aria-label="Navegación principal"></nav>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ============================================================
 * Constantes
 * ============================================================ */

/* ============================================================
 * Utilidades
 * ============================================================ */
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function r2(n) { return Math.round(n * 100) / 100; }
function num(x) {
  if (typeof x === 'number') return x;
  var s = String(x === null || x === undefined ? '' : x).replace(/[^\d,.\-]/g, '');
  if (!s) return 0;
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtNum(n, dec) {
  var s = Math.abs(n).toFixed(dec).split('.');
  var ent = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (n < 0 && Math.abs(n) >= Math.pow(10, -dec) / 2 ? '−' : '') + ent + (dec ? ',' + s[1] : '');
}
function money(n) { return 'S/ ' + fmtNum(Math.abs(n), 2).replace('−', ''); }
function smoney(n) { var v = r2(n); return (v > 0 ? '+' : v < 0 ? '−' : '') + 'S/ ' + fmtNum(Math.abs(v), 2); }
function pct(x) { var v = Math.round(x * 1000) / 10; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',') + ' %'; }
function shortPct(x) { var v = Math.round(x * 1000) / 10; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ','); }
function tone(x) { return x > 0.0005 ? 'var(--gainT)' : x < -0.0005 ? 'var(--lossT)' : 'var(--ink)'; }
function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }

function toUTC(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function fromUTC(t) {
  var d = new Date(t);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function addDays(s, n) { return fromUTC(toUTC(s) + n * 86400000); }
function wd(s) { return (new Date(toUTC(s)).getUTCDay() + 6) % 7; }
function ddmm(s) { return s.slice(8, 10) + '/' + s.slice(5, 7); }
function ymOf(s) { return String(s).slice(0, 7); }
function daysIn(ym) { var p = ym.split('-'); return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate(); }
function ymAdd(ym, n) {
  var p = ym.split('-');
  var t = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1));
  return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0');
}
function ymName(ym) { return MESES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
function unidad(m) {
  m = String(m || '');
  if (/c[oó]rner/i.test(m)) return 'córners';
  if (/tarjeta/i.test(m)) return 'tarjetas';
  if (/remate|tiro/i.test(m)) return 'remates';
  if (/gol/i.test(m) && !/goleador|ambos/i.test(m)) return 'goles';
  return null;
}
function byNewest(a, b) { var x = b.fecha + (b.hora || '') + b.id, y = a.fecha + (a.hora || '') + a.id; return x < y ? -1 : x > y ? 1 : 0; }

/* ============================================================
 * Cálculos
 * ============================================================ */
function betNet(b) {
  if (b.estado === 'Ganada') return r2(b.monto * b.cuota - b.monto);
  if (b.estado === 'Perdida') return -b.monto;
  if (b.estado === 'Cash out') return r2(b.retorno - b.monto);
  return 0;
}

function compute(D) {
  var bets = D.bets.map(function (b) {
    var o = Object.assign({}, b, { monto: num(b.monto), cuota: num(b.cuota), retorno: num(b.retorno), nsel: Number(b.nsel) || 1 });
    o.net = betNet(o);
    return o;
  });
  var moves = D.moves.map(function (m) {
    return Object.assign({}, m, { monto: num(m.monto), signed: (m.tipo === 'Retiro' ? -1 : 1) * num(m.monto) });
  });
  var all = bets.map(function (b) { return b.fecha; }).concat(moves.map(function (m) { return m.fecha; })).filter(Boolean).sort();
  var start = all.length ? all[0] : D.today;
  var end = D.today;
  if (all.length && all[all.length - 1] > end) end = all[all.length - 1];

  var agg = {}, mv = {};
  bets.forEach(function (b) {
    var a = agg[b.fecha] || (agg[b.fecha] = { net: 0, n: 0, w: 0, l: 0, c: 0, stake: 0, pend: 0 });
    if (b.estado === 'Pendiente') { a.pend++; return; }
    if (b.estado === 'Anulada') return;
    a.n++; a.stake += b.monto; a.net += b.net;
    if (b.estado === 'Ganada') a.w++; else if (b.estado === 'Perdida') a.l++; else a.c++;
  });
  moves.forEach(function (m) { mv[m.fecha] = (mv[m.fecha] || 0) + m.signed; });

  var days = {}, order = [], bank = 0, curYm = '', cum = 1;
  for (var d = start; d <= end; d = addDays(d, 1)) {
    var a = agg[d] || { net: 0, n: 0, w: 0, l: 0, c: 0, stake: 0, pend: 0 };
    var mov = r2(mv[d] || 0);
    var open = r2(bank + mov);
    var net = r2(a.net);
    var close = r2(open + net);
    var dayX = open > 0 ? net / open : 0;
    if (ymOf(d) !== curYm) { curYm = ymOf(d); cum = 1; }
    cum *= 1 + dayX;
    days[d] = { d: d, open: open, close: close, net: net, mov: mov, has: a.n > 0, n: a.n, w: a.w, l: a.l, c: a.c, stake: r2(a.stake), pend: a.pend, dayX: dayX, monthX: cum - 1 };
    order.push(d);
    bank = close;
  }
  var pendStake = r2(bets.filter(function (b) { return b.estado === 'Pendiente'; }).reduce(function (s, b) { return s + b.monto; }, 0));
  var today = days[D.today] || { d: D.today, open: bank, close: bank, net: 0, mov: 0, has: false, n: 0, w: 0, l: 0, c: 0, stake: 0, pend: 0, dayX: 0, monthX: 0 };
  return { bets: bets, moves: moves, days: days, order: order, today: today, bankNow: today.close, pendStake: pendStake };
}

function monthStats(ym) {
  var C = S.C;
  var list = C.order.filter(function (d) { return d.indexOf(ym) === 0 && d <= S.D.today; }).map(function (d) { return C.days[d]; });
  var bets = C.bets.filter(function (b) { return ymOf(b.fecha) === ym; });
  var settled = bets.filter(function (b) { return b.estado === 'Ganada' || b.estado === 'Perdida' || b.estado === 'Cash out'; });
  var net = r2(list.reduce(function (s, x) { return s + x.net; }, 0));
  var stake = r2(settled.reduce(function (s, b) { return s + b.monto; }, 0));
  var withBets = list.filter(function (x) { return x.has; });
  function group(key) {
    var g = {};
    settled.forEach(function (b) {
      var k = b[key] || 'Sin dato';
      var o = g[k] || (g[k] = { name: k, n: 0, net: 0, stake: 0, w: 0 });
      o.n++; o.net = r2(o.net + b.net); o.stake = r2(o.stake + b.monto);
      if (b.estado === 'Ganada') o.w++;
    });
    return Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return a.net - b.net; });
  }
  return {
    ym: ym, list: list, bets: bets, n: settled.length, net: net, stake: stake,
    twr: list.length ? list[list.length - 1].monthX : 0,
    w: settled.filter(function (b) { return b.estado === 'Ganada'; }).length,
    pos: withBets.filter(function (x) { return x.net > 0; }).length,
    betDays: withBets.length,
    startBank: list.length ? list[0].open : null,
    moves: C.moves.filter(function (m) { return ymOf(m.fecha) === ym; }).sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; }),
    byMarket: group('mercado'),
    byMode: group('modalidad')

}

function niceTicks(lo, hi, count) {
  var span = hi - lo || 1;
  var raw = span / count;
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var e = raw / mag;
  var step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  var a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  var out = [];
  for (var v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return { ticks: out, step: step };
}

function viewMes() {
  var C = S.C, D = S.D, ym = S.ym, M = monthStats(ym), isCur = ym === ymOf(D.today), list = M.list;
  if (!S.sel || !C.days[S.sel] || ymOf(S.sel) !== ym || S.sel > D.today) {
    S.sel = isCur && C.days[D.today] ? D.today : (list.length ? list[list.length - 1].d : null);
  }
  var last = list.length ? list[list.length - 1] : null;
  var kd = isCur ? C.today : last;
  var sub = list.length
    ? (isCur ? 'Día ' + (+D.today.slice(8)) + ' de ' + daysIn(ym) + ' · ' : '') + 'bank al iniciar el mes ' + money(M.startBank)
    : 'Sin registros este mes';

  var strip = list.map(function (x) {
    return '<i title="' + ddmm(x.d) + ' · ' + (x.has ? pct(x.dayX) : 'sin apuestas') + '" style="background:' + (!x.has ? '#3A4250' : x.net > 0 ? 'var(--gain)' : 'var(--loss)') + '"></i>';
  }).join('');

  return '<section class="page">' +
    '<div class="head"><div><div class="eyebrow">Resumen mensual</div>' + monthNav(ym) + '<p class="sub">' + sub + '</p></div>' +
    '<button class="btn-ghost" data-act="view" data-v="mov">' + IC.swap + ' Depósito o retiro</button></div>' +

    '<section class="kpis" aria-label="Indicadores del mes">' +
      kpi(isCur ? 'Bank actual' : 'Bank al cierre', money(isCur ? C.bankNow : (last ? last.close : 0)), '',
        (M.startBank !== null ? 'Inicial ' + money(M.startBank) + ' · ' : '') + smoney(M.net) + ' en el mes' + (isCur && C.pendStake > 0 ? ' · ' + money(C.pendStake) + ' en juego' : '')) +
      kpi('Resultado del mes', pct(M.twr), tone(M.twr), M.n ? plural(M.n, 'apuesta', 'apuestas') + ' · yield ' + pct(M.net / M.stake) : 'Sin apuestas resueltas aún') +
      (kd ? kpi((isCur ? 'Hoy · ' : 'Último día · ') + DSH[wd(kd.d)] + ' ' + ddmm(kd.d), pct(kd.dayX), tone(kd.dayX), (kd.has ? smoney(kd.net) + ' · ' : '') + 'abriste con ' + money(kd.open)) : '') +
      '<div class="card kpi"><div class="lbl">Días en positivo</div><div class="val">' + M.pos + ' <span style="font-size:.58em;color:var(--muted)">de ' + M.betDays + '</span></div>' +
      '<div class="strip" role="img" aria-label="' + M.pos + ' días positivos de ' + M.betDays + ' con apuestas">' + strip + '</div><div class="note">Días con apuestas en el mes</div></div>' +
    '</section>' +

    '<div class="row"><section class="card grow" aria-labelledby="t-evol">' + chartBlock(M) + '</section>' +
    '<section class="card side" aria-labelledby="t-mov">' + movBlock(M) + '</section></div>' +

    '<div class="row"><section class="card grow" aria-labelledby="t-cal">' + calBlock(M) + '</section>' +
    '<section class="card side" aria-labelledby="t-dia" aria-live="polite">' + detailBlock() + '</section></div>' +

    '<section class="card" aria-labelledby="t-mer">' + analysisBlock(M) + '</section>' +
  '</section>';
}

function chartBlock(M) {
  var unit = S.unit, list = M.list;
  var head = '<div class="card-h"><div><h2 class="h2" id="t-evol">Evolución del bank</h2><p class="sub">Cierre de cada día · la línea punteada es tu bank al iniciar el mes</p></div>' +
    '<div class="seg" role="group" aria-label="Unidad">' + ['S/', '%'].map(function (u) {
      return '<button data-act="unit" data-v="' + u + '" aria-pressed="' + (u === unit) + '">' + u + '</button>';
    }).join('') + '</div></div>';
  if (!list.length) return head + '<div class="empty" style="margin-top:20px">Sin datos este mes</div>';

  var nd = daysIn(M.ym), first = +list[0].d.slice(8);
  var pts = [{ x: (first - 1) / nd, v: unit === '%' ? 0 : M.startBank }].concat(list.map(function (x) {
    return { x: +x.d.slice(8) / nd, v: unit === '%' ? x.monthX * 100 : x.close };
  }));
  var base = pts[0].v;
  var vals = pts.map(function (p) { return p.v; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var minSpan = unit === '%' ? 4 : Math.max(1, Math.abs(base) * 0.1);
  if (hi - lo < minSpan) { var mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  var T = niceTicks(lo, hi, 4), t0 = T.ticks[0], t1 = T.ticks[T.ticks.length - 1];
  var yp = function (v) { return (1 - (v - t0) / (t1 - t0)) * 100; };
  var P = pts.map(function (p) { return { x: p.x * 1000, y: yp(p.v) * 2.8 }; });
  var line = P.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
  var area = line + ' L' + P[P.length - 1].x.toFixed(1) + ' 280 L' + P[0].x.toFixed(1) + ' 280 Z';
  var lp = P[P.length - 1];
  var dec = unit === '%' ? (T.step < 1 ? 1 : 0) : (T.step < 1 ? 2 : 0);
  var label = function (v) {
    return unit === '%' ? (v > 0 ? '+' : v < 0 ? '−' : '') + fmtNum(Math.abs(v), dec) + ' %' : fmtNum(v, dec);
  };
  var grid = T.ticks.map(function (v) {
    return '<div class="gl" style="top:' + yp(v) + '%"></div><span class="yl num" style="top:' + yp(v) + '%">' + label(v) + '</span>';
  }).join('') + '<div class="gl base" style="top:' + yp(base) + '%"></div>';
  var xt = [1, 8, 15, 22, nd].map(function (d, i, a) {
    return '<span style="left:' + (d / nd * 100) + '%;transform:translateX(-' + (i === a.length - 1 ? 100 : 50) + '%)">' + String(d).padStart(2, '0') + '/' + M.ym.slice(5) + '</span>';
  }).join('');
  var tipCls = lp.x > 860 ? ' r' : lp.x < 140 ? ' l' : '';
  var aria = 'Bank al cierre de cada día: empezó el mes en ' + money(M.startBank) + ' y va en ' + money(list[list.length - 1].close) + ' (' + pct(M.twr) + ').';

  return head + '<div class="chart" role="img" aria-label="' + esc(aria) + '">' + grid +
    '<svg viewBox="0 0 1000 280" preserveAspectRatio="none" aria-hidden="true">' +
      (list.length > 1 ? '<path d="' + area + '" style="fill:var(--accent);fill-opacity:.12;stroke:none"/>' : '') +
      '<path d="' + line + '" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round" vector-effect="non-scaling-stroke"/>' +
    '</svg>' +
    '<div class="dot" style="left:' + (lp.x / 10) + '%;top:' + (lp.y / 2.8) + '%"></div>' +
    '<div class="tip num' + tipCls + '" style="left:' + (lp.x / 10) + '%;top:' + (lp.y / 2.8) + '%">' + (unit === '%' ? pct(M.twr) : money(pts[pts.length - 1].v)) + '</div>' +
    (M.n === 0 ? '<div class="msg">Tu curva empieza con la primera apuesta</div>' : '') +
    '</div><div class="xt num">' + xt + '</div>';
}

function analysisBlock(M) {
  var head = '<div class="card-h"><div><h2 class="h2" id="t-mer">Dónde ganas y dónde pierdes</h2><p class="sub">' +
    (M.n ? plural(M.n, 'apuesta resuelta', 'apuestas resueltas') + ' en ' + ymName(M.ym).toLowerCase() : 'Mes en curso') + '</p></div>' +
    '<button class="link" data-act="view" data-v="apuestas">Ver todas las apuestas →</button></div>';
  if (!M.n) return head + '<div class="empty" style="margin-top:16px">El análisis por mercado y modalidad aparece cuando tengas apuestas resueltas.</div>';

  var ms = M.byMarket;
  var neg = Math.max.apply(null, [0].concat(ms.map(function (m) { return -m.net; })));
  var pos = Math.max.apply(null, [0].concat(ms.map(function (m) { return m.net; })));
  var tot = (neg + pos) || 1, z = neg / tot * 100;
  var rows = ms.map(function (m) {
    var w = Math.abs(m.net) / tot * 100;
    if (m.net !== 0) w = Math.max(w, 0.8);
    var l = m.net < 0 ? z - w : z;
    return '<div class="mrow"><div class="min0"><div class="b">' + esc(m.name) + '</div><div class="xs muted">' + plural(m.n, 'apuesta', 'apuestas') + ' · ' + plural(m.w, 'ganada', 'ganadas') + '</div></div>' +
      '<div class="mtrack" title="' + esc(m.name + ' · ' + smoney(m.net)) + '"><div class="z" style="left:' + z + '%"></div>' +
      '<div class="bf" style="left:' + l + '%;width:' + w + '%;background:' + (m.net < 0 ? 'var(--loss)' : 'var(--gain)') + ';border-radius:' + (m.net < 0 ? '4px 0 0 4px' : '0 4px 4px 0') + '"></div></div>' +
      '<div class="b num" style="text-align:right">' + smoney(m.net) + '</div></div>';
  }).join('');
  var modes = M.byMode.slice().sort(function (a, b) { return a.name < b.name ? 1 : -1; }).map(function (m) {
    var hit = m.n ? m.w / m.n : 0;
    return '<div class="mode"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span class="b">' + esc(m.name) + '</span>' +
      '<span class="disp num" style="font-size:22px;font-weight:600;color:' + tone(m.net) + '">' + smoney(m.net) + '</span></div>' +
      '<div class="xs ink2" style="display:flex;justify-content:space-between;gap:12px"><span>' + plural(m.n, 'apuesta', 'apuestas') + ' · ' + money(m.stake) + '</span><span>Yield ' + pct(m.stake ? m.net / m.stake : 0) + '</span></div>' +
      '<div class="bar"><i style="width:' + (hit * 100) + '%"></i></div><div class="xs muted">Acierto ' + Math.round(hit * 100) + ' % · ' + m.w + ' de ' + m.n + '</div></div>';
  }).join('');
  return head + '<div class="row" style="gap:28px;margin-top:16px">' +
    '<div class="grow" style="flex-basis:520px"><div class="card-h" style="margin-bottom:8px"><h3 class="h3">Por mercado</h3><span class="xs muted">Neto en S/ · de peor a mejor</span></div>' + rows + '</div>' +
    '<div class="side" style="gap:12px"><h3 class="h3">Por modalidad</h3>' + modes + '</div></div>';
}

    '<div class="grid2" style="padding-top:12px;border-top:1px solid var(--raised)">' +
      '<div><div class="xs muted">Si sale</div><div class="disp num" style="font-size:19px;font-weight:600;color:var(--gainT)">+' + money(gan) + '</div><div class="xs ink2 num">Bank: ' + money(bank + gan) + '</div></div>' +
      '<div><div class="xs muted">Si pierdes</div><div class="disp num" style="font-size:19px;font-weight:600;color:var(--lossT)">−' + money(monto) + '</div><div class="xs ink2 num">Bank: ' + money(Math.max(0, bank - monto)) + '</div></div>' +
    '</div>' +
    '<div class="xs muted">Probabilidad implícita de la cuota: ' + (cuota > 1 ? fmtNum(100 / cuota, 1) + ' %' : '—') + '</div>';
}

/* ============================================================
 * Vista: Movimientos del bank
 * ============================================================ */
function defaultMov(tipo) { return { tipo: tipo || 'Depósito', fecha: S.D.today, monto: '', nota: '' }; }
function viewMov() {
  var f = S.mform, all = S.C.moves.slice().sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
  return '<section class="page narrow">' +
    '<div class="form-head"><div><div class="eyebrow">Bank</div><h1 class="h1" style="font-size:30px">Movimientos</h1><p class="sub">Depósitos y retiros no cuentan como ganancia ni pérdida</p></div>' +
      '<div class="bank-mini"><div class="xs muted">Bank actual</div><div class="b num" style="font-size:18px">' + money(S.C.bankNow) + '</div></div></div>' +
    '<section class="card stack" aria-label="Nuevo movimiento">' +
      '<div class="field"><span class="flabel" id="l-mt">Tipo</span><div class="seg" role="group" aria-labelledby="l-mt">' +
        ['Depósito', 'Retiro', 'Bank inicial'].map(function (t) { return '<button type="button" data-act="mt" data-v="' + t + '" aria-pressed="' + (t === f.tipo) + '">' + t + '</button>'; }).join('') + '</div></div>' +
      '<div class="grid2">' +
        '<label class="field"><span class="flabel">Fecha</span><input class="input" type="date" data-m="fecha" value="' + esc(f.fecha) + '"></label>' +
        '<label class="field"><span class="flabel">Monto (S/)</span><input class="input big" inputmode="decimal" data-m="monto" value="' + esc(f.monto) + '" placeholder="0,00"></label></div>' +
      '<label class="field"><span class="flabel">Nota (opcional)</span><input class="input" data-m="nota" value="' + esc(f.nota) + '" placeholder="Ej. Recarga"></label>' +
      (f.tipo === 'Bank inicial' ? '<p class="xs muted" style="margin:0">Úsalo solo si reinicias tu bank desde cero: se suma como dinero nuevo.</p>' : '') +
      '<button class="btn-acc wide" data-act="save-mov">Guardar movimiento</button>' +
    '</section>' +
    '<div class="sec-h"><h2>Historial</h2></div>' +
    (all.length ? '<div class="mvs">' + all.map(mvRow).join('') + '</div>' : '<div class="empty">Sin movimientos</div>') +
    '<div class="sec-h"><h2>Conexión</h2></div>' +
    '<section class="card" style="display:flex;align-items:center;gap:12px;padding:16px 18px"><div class="min0"><div class="b">Conectado a tu hoja</div>' +
      '<div class="xs muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(S.cfg ? S.cfg.url : '') + '</div></div>' +
      '<button class="link" data-act="disconnect">Cambiar</button></section>' +
  '</section>';
}

/* ============================================================
 * Diálogo y avisos
 * ============================================================ */
function renderModal() {
  var el = document.getElementById('modal'), m = S.modal;
  if (!m) { el.hidden = true; el.innerHTML = ''; return; }
  var b = S.C.bets.filter(function (x) { return x.id === m.id; })[0] || {};
  el.hidden = false;
  if (m.type === 'cashout') {
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">Cash out</h2>' +
      '<p class="s ink2">' + esc(b.evento || b.mercado || '') + ' · apostaste ' + money(b.monto || 0) + '</p>' +
      '<label class="field"><span class="flabel">¿Cuánto cobraste? (S/)</span><input class="input big" id="m-in" inputmode="decimal" placeholder="0,00"></label>' +
      '<div class="m-actions"><button class="btn-ghost" data-act="modal-cancel">Cancelar</button><button class="btn-acc" data-act="modal-ok">Guardar</button></div></div>';
  } else {
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">¿Eliminar esta apuesta?</h2>' +
      '<p class="s ink2">' + esc((b.evento || b.mercado || '') + ' · ' + (b.seleccion || '')) + '. Se borra de tu hoja y no se puede deshacer.</p>' +
      '<div class="m-actions"><button class="btn-ghost" data-act="modal-cancel">Cancelar</button><button class="btn-danger" data-act="modal-ok">Eliminar</button></div></div>';
  }
  setTimeout(function () { var i = document.getElementById('m-in'); if (i) i.focus(); }, 30);
}
var toastTimer = null;
function toast(msg, err) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = err ? 'err' : '';
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, err ? 5000 : 2800);
}

/* ============================================================
 * Servidor
 * ============================================================ */
var LS_CFG = 'bankroll.cfg', LS_CACHE = 'bankroll.cache';
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function api(action, args) {
  return fetch(S.cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ key: S.cfg.key, action: action, args: args || [] })
  }).then(function (r) {
    if (!r.ok) throw new Error('Tu hoja respondió con un error (' + r.status + ').');
    return r.text();
  }).then(function (t) {
    var j;
    try { j = JSON.parse(t); } catch (e) { throw new Error('Respuesta inesperada: revisa que la URL termine en /exec y que el acceso sea "Cualquier persona".'); }
    if (!j.ok) throw new Error(j.error || 'Error desconocido.');
    return j.data;
  });
}
function errMsg(e) {
  var m = (e && e.message) || String(e);
  if (/failed to fetch|load failed|networkerror|network request failed/i.test(m)) return 'No pude conectar con tu hoja. Revisa tu internet, la URL y que el acceso de la implementación sea "Cualquier persona".';
  return m;
}
function setBusy(b) { S.busy = b; document.body.classList.toggle('busy', b); }

function load(d) {
  if (!d || d.needsSetup) {
    S.D = null;
    document.getElementById('app').innerHTML = '<div class="loading"><p class="b" style="font-size:18px">Falta preparar tu hoja</p>' +
      '<p>En el editor de Apps Script, elige la función <b>setup</b>, pulsa <b>Ejecutar</b> y luego vuelve a abrir esta página.</p></div>';
    return false;
  }
  var prevToday = S.D ? S.D.today : null;
  S.D = d;
  S.C = compute(d);
  if (!S.ym || (prevToday && prevToday !== d.today && S.ym === ymOf(prevToday))) S.ym = ymOf(d.today);
  if (prevToday && prevToday !== d.today) {
    S.sel = null;
    if (S.form && S.form.fecha === prevToday) S.form.fecha = d.today;
  }
  lsSet(LS_CACHE, d);
  return true;
}
function call(fn, args, msg, after) {
  if (S.busy || !S.cfg) return;
  setBusy(true);
  api(fn, args).then(function (d) {
    setBusy(false); S.lastLoad = Date.now();
    if (load(d)) { if (after) after(); render(); if (msg) toast(msg); }
  }).catch(function (e) { setBusy(false); toast(errMsg(e), true); });
}
function refresh(silent) {
  if (S.busy || !S.cfg) return;
  setBusy(true);
  api('getData', []).then(function (d) {
    setBusy(false); S.lastLoad = Date.now();
    if (!load(d)) return;
    if (S.view === 'nueva' || S.view === 'mov') updatePreview();
    else if (!S.modal) render();
    if (!silent) toast('Datos actualizados');
  }).catch(function (e) {
    setBusy(false);
    var m = errMsg(e);
    if (!S.D || /clave/i.test(m)) showConnect(m, S.cfg);
    else toast(silent ? 'Sin conexión: mostrando tus últimos datos' : m, true);
  });
}
function showConnect(err, vals) {
  S.D = null;
  document.body.classList.add('connecting');
  document.getElementById('fab').hidden = true;
  var v = vals || {};
  document.getElementById('app').innerHTML = '<section class="connect"><div class="card stack">' +
    '<span class="mark">' + IC.trend + '</span>' +
    '<div><h1 class="h2" style="font-size:24px">Conecta tu hoja</h1><p class="sub">Pega la URL de tu app web de Apps Script y tu clave. Se guardan solo en este dispositivo.</p></div>' +
    (err ? '<div class="err-box" role="alert">' + esc(err) + '</div>' : '') +
    '<label class="field"><span class="flabel">URL de la app web</span><input class="input" id="c-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(v.url || '') + '"></label>' +
    '<label class="field"><span class="flabel">Clave</span><input class="input" id="c-key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="La que te mostró setup()" value="' + esc(v.key || '') + '"></label>' +
    '<button class="btn-acc wide" data-act="connect">Conectar</button>' +
    '<p class="help" style="margin:0">¿Perdiste la clave? En Apps Script ejecuta la función <b>verClave</b> y mírala en el registro de ejecución.</p>' +
  '</div></section>';
}
function doConnect() {
  if (S.busy) return;
  var u = document.getElementById('c-url'), k = document.getElementById('c-key');
  var vals = { url: u ? u.value.trim() : '', key: k ? k.value.trim() : '' };
  if (!/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(vals.url)) return showConnect('La URL debe empezar con https://script.google.com/ y terminar en /exec.', vals);
  if (!vals.key) return showConnect('Pega tu clave.', vals);
  S.cfg = vals;
  setBusy(true);
  var btn = document.querySelector('[data-act="connect"]');
  if (btn) btn.textContent = 'Conectando…';
  api('getData', []).then(function (d) {
    setBusy(false);
    lsSet(LS_CFG, S.cfg); S.lastLoad = Date.now();
    if (load(d)) { render(); toast('Conectado a tu hoja'); }
  }).catch(function (e) { setBusy(false); S.cfg = null; showConnect(errMsg(e), vals); });
}
function disconnect() {
  var old = S.cfg;
  lsSet(LS_CFG, null); lsSet(LS_CACHE, null);
  S.cfg = null; S.form = null; S.mform = null;
  showConnect('', old);
}
function saveBet() {
  var f = S.form, cuota = num(f.cuota), monto = num(f.monto), u = unidad(f.mercado);
  if (!(cuota >= 1.01)) return toast('Ingresa la cuota (mayor que 1).', true);
  if (!(monto > 0)) return toast('Ingresa el monto apostado.', true);
  if (f.estado === 'Cash out' && String(f.retorno).trim() === '') return toast('Indica cuánto cobraste en el cash out.', true);
  var now = new Date();
  var payload = {
    fecha: f.fecha || S.D.today,
    hora: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
    deporte: f.deporte, competicion: f.competicion.trim(), evento: f.evento.trim(), mercado: f.mercado,
    seleccion: u ? f.lado + ' ' + fmtNum(f.linea, 1) + ' ' + u : f.seleccion.trim(),
    tipo: f.tipo, nsel: f.tipo === 'Combinada' ? f.nsel : 1, modalidad: f.modalidad,
    cuota: cuota, monto: monto, estado: f.estado, retorno: num(f.retorno), notas: f.notas.trim()
  };
  call('saveBet', [payload], 'Apuesta guardada', function () {
    S.form = defaultForm();
    S.view = S.prev && S.prev !== 'nueva' && S.prev !== 'mov' ? S.prev : 'hoy';
  });
}
function saveMov() {
  var f = S.mform;
  if (!(num(f.monto) > 0)) return toast('Ingresa el monto.', true);
  call('saveMove', [{ tipo: f.tipo, fecha: f.fecha || S.D.today, monto: num(f.monto), nota: String(f.nota || '').trim() }], 'Movimiento guardado', function () {
    S.mform = defaultMov(f.tipo);
  });
}

/* ============================================================
 * Render y eventos
 * ============================================================ */
function render() {
  if (!S.D) return;
  document.body.classList.remove('connecting');
  var v = S.view;
  if (v === 'nueva' && !S.form) S.form = defaultForm();
  if (v === 'mov' && !S.mform) S.mform = defaultMov();
  document.querySelectorAll('[data-nav]').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'page' : 'false'); });
  document.body.classList.toggle('formview', v === 'nueva');
  document.getElementById('fab').hidden = v === 'nueva' || v === 'mov';
  document.getElementById('app').innerHTML =
    v === 'hoy' ? viewHoy() : v === 'apuestas' ? viewApuestas() : v === 'nueva' ? viewNueva() : v === 'mov' ? viewMov() : viewMes();
  if (v === 'nueva') updatePreview();
  renderModal();
}

document.addEventListener('click', function (e) {
  if (e.target.id === 'modal') { S.modal = null; renderModal(); return; }
  var t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  var a = t.getAttribute('data-act'), v = t.getAttribute('data-v');
  if (a === 'connect') { doConnect(); return; }
  if (a === 'refresh') { refresh(false); return; }
  if (!S.D) return;
  switch (a) {
    case 'view':
      if ((v === 'nueva' || v === 'mov') && S.view !== 'nueva' && S.view !== 'mov') S.prev = S.view;
      if (v === 'mov') S.mform = defaultMov(t.getAttribute('data-t') || (S.mform && S.mform.tipo));
      S.view = v; render(); window.scrollTo(0, 0); break;
    case 'month': S.ym = ymAdd(S.ym, +t.getAttribute('data-d')); S.sel = null; render(); break;
    case 'sel': S.sel = t.getAttribute('data-d'); render(); break;
    case 'unit': S.unit = v; render(); break;
    case 'filter': S.filter = v; render(); break;
    case 'f':
      var k = t.getAttribute('data-k');
      S.form[k] = v;
      if (k === 'mercado') S.form.linea = LINEA_DEF[v] || S.form.linea || 2.5;
      render(); break;
    case 'line': S.form.linea = Math.max(0.5, Math.round((S.form.linea + Number(t.getAttribute('data-d'))) * 10) / 10); render(); break;
    case 'nsel': S.form.nsel = Math.max(2, Math.min(20, S.form.nsel + Number(t.getAttribute('data-d')))); render(); break;
    case 'mt': S.mform.tipo = v; render(); break;
    case 'disconnect': disconnect(); break;
    case 'save': saveBet(); break;
    case 'save-mov': saveMov(); break;
    case 'settle': call('settleBet', [t.getAttribute('data-id'), v, 0], v === 'Pendiente' ? 'Apuesta reabierta' : 'Resultado guardado'); break;
    case 'cashout': S.modal = { type: 'cashout', id: t.getAttribute('data-id') }; renderModal(); break;
    case 'del': S.modal = { type: 'del', id: t.getAttribute('data-id') }; renderModal(); break;
    case 'modal-cancel': S.modal = null; renderModal(); break;
    case 'modal-ok':
      var m = S.modal;
      if (!m) break;
      if (m.type === 'cashout') {
        var val = document.getElementById('m-in').value;
        if (String(val).trim() === '') { toast('Indica cuánto cobraste.', true); break; }
        S.modal = null; renderModal();
        call('settleBet', [m.id, 'Cash out', num(val)], 'Cash out guardado');
      } else {
        S.modal = null; renderModal();
        call('deleteBet', [m.id], 'Apuesta eliminada');
      }
      break;
  }
});
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute('data-f');
  if (k && S.form) { S.form[k] = e.target.value; updatePreview(); return; }
  var mk = e.target.getAttribute('data-m');
  if (mk && S.mform) S.mform[mk] = e.target.value;
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.target.id === 'c-url' || e.target.id === 'c-key')) { e.preventDefault(); doConnect(); return; }
  if (e.key === 'Escape' && S.modal) { S.modal = null; renderModal(); }
  if (e.key === 'Enter' && S.modal && e.target.id === 'm-in') { var ok = document.querySelector('[data-act="modal-ok"]'); if (ok) ok.click(); }
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.cfg && Date.now() - (S.lastLoad || 0) > 60000) refresh(true);
});

/* ============================================================
 * Inicio
 * ============================================================ */
(function init() {
  document.getElementById('brand-mark').innerHTML = IC.trend;
  document.getElementById('btn-nueva').insertAdjacentHTML('afterbegin', IC.plus);
  document.getElementById('fab').innerHTML = IC.plusBig;
  document.getElementById('bottom').innerHTML = [['hoy', 'Hoy', IC.pulse], ['mes', 'Mes', IC.cal], ['apuestas', 'Apuestas', IC.list], ['mov', 'Bank', IC.wallet]].map(function (n) {
    return '<button data-nav data-act="view" data-v="' + n[0] + '">' + n[2] + n[1] + '</button>';
  }).join('');
  document.getElementById('btn-refresh').innerHTML = IC.refresh;
  S.cfg = lsGet(LS_CFG);
  if (!S.cfg || !S.cfg.url || !S.cfg.key) { S.cfg = null; showConnect(''); return; }
  var cached = lsGet(LS_CACHE);
  if (cached && load(cached)) render();
  refresh(true);
})();
</script>
